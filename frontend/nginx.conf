server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend service.
    # This means WAF → frontend → backend for API calls.
    # ModSecurity inspects the full request (body, headers) before it ever reaches here.
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve static files. Falls back to index.html for SPA routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
